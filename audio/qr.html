<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR codes — Ηχητικός οδηγός</title>
<link rel="stylesheet" href="css/style.css">
<!-- Βιβλιοθήκη QR (χρειάζεται internet μόνο σε αυτή τη σελίδα, που είναι για σένα, όχι για τους επισκέπτες) -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  .setup{display:grid;gap:8px;margin-bottom:20px}
  .setup input{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);width:100%}
  .setup small{color:var(--muted)}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .qr{text-align:center;break-inside:avoid;page-break-inside:avoid}
  .qr svg{width:100%;height:auto;max-width:200px;display:block;margin:0 auto 8px}
  .qr .label{font-family:var(--serif);font-weight:700;line-height:1.25}
  .qr .label-en{font-size:.85rem;color:var(--muted);font-style:italic}
  .qr .hint{font-size:.78rem;margin-top:8px;color:var(--pine);font-weight:600}
  .qr .url{font-size:.68rem;color:var(--muted);word-break:break-all;margin-top:4px}
  .qr .dl{margin-top:10px;display:flex;gap:6px;justify-content:center}
  .qr .dl button{color:var(--pine)}
  .actions{display:flex;gap:10px;flex-wrap:wrap}
  .actions .pill{color:var(--pine)}
  @media print{
    .topbar,.setup,.actions,.dl,.url{display:none!important}
    body{background:#fff} .card{box-shadow:none;border:1px dashed #bbb}
    .grid{grid-template-columns:repeat(3,1fr)}
  }
</style>
</head>
<body>
<header class="topbar"><span class="museum-name">QR codes · Ηχητικός οδηγός</span>
  <a class="pill" style="color:#f3ead7;text-decoration:none" href="index.html">Λίστα</a></header>
<main class="content">
  <div class="card setup">
    <label for="base"><strong>Διεύθυνση όπου θα ανέβει ο φάκελος</strong></label>
    <input id="base" placeholder="https://lesvosresinmuseum.gr/audio/">
    <small>Γράψε τη διεύθυνση του φακέλου στον server (όπου βρίσκεται το player.html). Τα QR ενημερώνονται αμέσως.</small>
    <div class="actions"><button class="pill" onclick="window.print()">Εκτύπωση όλων</button></div>
  </div>
  <div class="grid" id="grid"></div>
</main>
<script src="data.js"></script>
<script>
  var input = document.getElementById("base");
  try { input.value = localStorage.getItem("rm-qr-base") || "https://lesvosresinmuseum.gr/audio/"; } catch (e) { input.value = "https://lesvosresinmuseum.gr/audio/"; }

  function urlFor(id) {
    var b = input.value.trim(); if (b && !/\/$/.test(b)) b += "/";
    return b + "player.html?id=" + encodeURIComponent(id);
  }
  function svgFor(text) {
    var qr = qrcode(0, "M"); qr.addData(text); qr.make();
    try { return qr.createSvgTag({ cellSize: 8, margin: 16, scalable: true }); }
    catch (e) { return qr.createSvgTag(8, 16); }
  }
  function download(name, data, type) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: type })); a.download = name; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  function downloadPng(name, svg) {
    var img = new Image(), c = document.createElement("canvas"); c.width = c.height = 1200;
    img.onload = function () {
      var g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, 1200, 1200); g.drawImage(img, 0, 0, 1200, 1200);
      c.toBlob(function (b) { var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name; a.click(); });
    };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }

  function render() {
    try { localStorage.setItem("rm-qr-base", input.value.trim()); } catch (e) {}
    var grid = document.getElementById("grid"); grid.innerHTML = "";
    if (typeof qrcode === "undefined") { grid.textContent = "Χρειάζεται σύνδεση στο internet για να φτιαχτούν τα QR."; return; }
    Object.keys(STOPS).forEach(function (id) {
      var s = STOPS[id], url = urlFor(id), svg = svgFor(url);
      var card = document.createElement("div"); card.className = "card qr";
      card.innerHTML = svg +
        '<div class="label"></div><div class="label-en"></div>' +
        '<div class="hint">🎧 Σκανάρετε & ακούστε · Scan & listen</div><div class="url"></div>' +
        '<div class="dl"><button class="pill b-svg">SVG</button><button class="pill b-png">PNG</button></div>';
      card.querySelector(".label").textContent = id + ". " + s.el.title;
      card.querySelector(".label-en").textContent = s.en ? s.en.title : "";
      card.querySelector(".url").textContent = url;
      card.querySelector(".b-svg").onclick = function () { download("qr-" + id + ".svg", svg, "image/svg+xml"); };
      card.querySelector(".b-png").onclick = function () { downloadPng("qr-" + id + ".png", svg); };
      grid.appendChild(card);
    });
  }
  input.addEventListener("input", render);
  window.addEventListener("load", render);
</script>
</body>
</html>
